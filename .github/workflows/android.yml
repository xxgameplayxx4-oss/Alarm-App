name: Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.run_number }}
        run: |
          android/prepare-web.sh
          gradle -p android assembleRelease --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk PushupAlarm.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PushupAlarm-apk
          path: PushupAlarm.apk

      # Builds from main replace the APK on the "android-latest" release, so the
      # download link never changes.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest PushupAlarm.apk \
            --title "Android APK (latest)" \
            --notes "Built from ${GITHUB_SHA::7}. Download PushupAlarm.apk on your Android phone and open it to install." \
            --target "$GITHUB_SHA"
